name: Documentation

# Regenerates the GitHub pages documentation in /docs with the scripts in /build
# MakeCab.exe is only available on Windows, so the external help cab files are built on a Windows runner

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'Celerium.Nova/**'
      - 'build/HtmlReport/**'
      - 'README.md'
      - 'build/Update-HelpContent.ps1'
      - 'build/Invoke-HelpContent.ps1'

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:

  docs:
    name: Build documentation
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install prerequisites
        run: ./build/Install-Prerequisites.ps1 -Verbose

      - name: Build the documentation
        run: ./build/Invoke-HelpContent.ps1 -Verbose

      - name: Commit the documentation changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if (git status --porcelain docs) {
            git commit -m 'docs: regenerate documentation'
            git push
          }
          else { Write-Output 'The documentation is up to date' }
